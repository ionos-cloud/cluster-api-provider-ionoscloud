# Replace Afterburn (no IONOS provider) with the local IONOS Cloud metadata provider.
# Keeps the standard Flatcar contract: Requires=coreos-metadata.service + EnvironmentFile=/run/metadata/flatcar.
[Unit]
Description=Flatcar Metadata Agent (IONOS Cloud)
ConditionKernelCommandLine=
Wants=network-online.target
After=network-online.target

[Service]
Environment=
ExecStart=
ExecStart=/usr/libexec/ionos-cloud/metadata /run/metadata/flatcar
ExecStartPost=
ExecStartPost=/usr/bin/ln -fs /run/metadata/flatcar /run/metadata/coreos
