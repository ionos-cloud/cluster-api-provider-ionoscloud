---
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: "${CLUSTER_NAME}"
  labels:
    cluster.x-k8s.io/cluster-name: "${CLUSTER_NAME}"
spec:
  clusterNetwork:
    pods:
      cidrBlocks: ["192.168.0.0/16"]
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
    kind: IonosCloudCluster
    name: "${CLUSTER_NAME}"
  controlPlaneRef:
    kind: KubeadmControlPlane
    apiVersion: controlplane.cluster.x-k8s.io/v1beta1
    name: "${CLUSTER_NAME}-control-plane"
---
apiVersion: v1
kind: Secret
metadata:
  name: "${CLUSTER_NAME}-credentials"
type: Opaque
stringData:
  token: "${IONOS_TOKEN}"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: IonosCloudCluster
metadata:
  name: "${CLUSTER_NAME}"
spec:
  controlPlaneEndpoint:
    host: ${CONTROL_PLANE_ENDPOINT_HOST:-${CONTROL_PLANE_ENDPOINT_IP}}
    port: ${CONTROL_PLANE_ENDPOINT_PORT:-6443}
  location: ${CONTROL_PLANE_ENDPOINT_LOCATION}
  credentialsRef:
    name: "${CLUSTER_NAME}-credentials"
---
kind: KubeadmControlPlane
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
metadata:
  name: "${CLUSTER_NAME}-control-plane"
spec:
  replicas: ${CONTROL_PLANE_MACHINE_COUNT}
  machineTemplate:
    infrastructureRef:
      kind: IonosCloudMachineTemplate
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
      name: "${CLUSTER_NAME}-control-plane"
  kubeadmConfigSpec:
    format: ignition
    ignition:
      containerLinuxConfig:
        additionalConfig: |
          storage:
            files:
              - path: /opt/extensions/kubernetes/kubernetes-${KUBERNETES_VERSION}-x86-64.raw
                mode: 0644
                contents:
                  remote:
                    url: ${FLATCAR_SYSEXT_BASE_URL:-https://extensions.flatcar.org/extensions}/kubernetes-${KUBERNETES_VERSION}-x86-64.raw
                    verification:
                      hash:
                        function: sha512
                        sum: ${KUBERNETES_SYSEXT_SHA512}
            links:
              - path: /etc/extensions/kubernetes.raw
                target: /opt/extensions/kubernetes/kubernetes-${KUBERNETES_VERSION}-x86-64.raw
                hard: false
          systemd:
            units:
              - name: update-engine.service
                mask: true
              - name: locksmithd.service
                mask: true
              - name: systemd-sysupdate.timer
                mask: true
              - name: systemd-sysupdate-reboot.timer
                mask: true
              - name: kubeadm.service
                dropins:
                  - name: 10-flatcar.conf
                    contents: |
                      [Unit]
                      Requires=containerd.service coreos-metadata.service
                      After=containerd.service coreos-metadata.service
                      [Service]
                      EnvironmentFile=/run/metadata/flatcar
    users:
      - name: core
        sshAuthorizedKeys: [${IONOSCLOUD_MACHINE_SSH_KEYS}]
    files:
      - path: /etc/kubernetes/manifests/kube-vip.yaml
        owner: root:root
        permissions: "0644"
        content: |
          apiVersion: v1
          kind: Pod
          metadata:
            name: kube-vip
            namespace: kube-system
          spec:
            containers:
            - args:
              - manager
              env:
              - name: cp_enable
                value: "true"
              - name: vip_interface
                value: ${VIP_NETWORK_INTERFACE=""}
              - name: address
                value: ${CONTROL_PLANE_ENDPOINT_IP}
              - name: port
                value: "${CONTROL_PLANE_ENDPOINT_PORT:-6443}"
              - name: vip_arp
                value: "true"
              - name: vip_leaderelection
                value: "true"
              - name: vip_leaseduration
                value: "15"
              - name: vip_renewdeadline
                value: "10"
              - name: vip_retryperiod
                value: "2"
              image: ghcr.io/kube-vip/kube-vip:v0.7.1
              imagePullPolicy: IfNotPresent
              name: kube-vip
              resources: {}
              securityContext:
                capabilities:
                  add:
                  - NET_ADMIN
                  - NET_RAW
              volumeMounts:
              - mountPath: /etc/kubernetes/admin.conf
                name: kubeconfig
            hostAliases:
            - hostnames:
              - kubernetes
              - localhost
              ip: 127.0.0.1
            hostNetwork: true
            volumes:
            - hostPath:
                path: /etc/kubernetes/admin.conf
                type: FileOrCreate
              name: kubeconfig
          status: {}
      - path: /etc/kube-vip-prepare.sh
        owner: root:root
        permissions: "0700"
        content: |
          #!/bin/bash
          set -e
          # kube-vip needs super-admin.conf during kubeadm init: https://github.com/kube-vip/kube-vip/issues/684
          if grep -q -e "kubeadm init" /etc/kubeadm.sh; then
            sed -i 's#path: /etc/kubernetes/admin.conf#path: /etc/kubernetes/super-admin.conf#' \
              /etc/kubernetes/manifests/kube-vip.yaml
          fi
      - path: /etc/ie-csi/cfg.json
        owner: root:root
        permissions: "0644"
        content: |
          {
            "datacenter-id": "${IONOSCLOUD_DATACENTER_ID}"
          }
    preKubeadmCommands:
      - >-
        (umask 0077; envsubst '$${COREOS_IONOSCLOUD_HOSTNAME} $${COREOS_IONOSCLOUD_INSTANCE_ID} $${COREOS_IONOSCLOUD_IPV4_DEFAULT}'
        < /etc/kubeadm.yml > /etc/kubeadm.yml.tmp)
      - mv /etc/kubeadm.yml.tmp /etc/kubeadm.yml
      - bash /etc/kube-vip-prepare.sh
    postKubeadmCommands:
      - >-
        sed -i 's#path: /etc/kubernetes/super-admin.conf#path: /etc/kubernetes/admin.conf#'
        /etc/kubernetes/manifests/kube-vip.yaml
    initConfiguration:
      localAPIEndpoint:
        bindPort: ${CONTROL_PLANE_ENDPOINT_PORT:-6443}
      nodeRegistration:
        name: $${COREOS_IONOSCLOUD_HOSTNAME}
        kubeletExtraArgs:
          node-ip: $${COREOS_IONOSCLOUD_IPV4_DEFAULT}
          provider-id: ionos://$${COREOS_IONOSCLOUD_INSTANCE_ID}
    joinConfiguration:
      nodeRegistration:
        name: $${COREOS_IONOSCLOUD_HOSTNAME}
        kubeletExtraArgs:
          node-ip: $${COREOS_IONOSCLOUD_IPV4_DEFAULT}
          provider-id: ionos://$${COREOS_IONOSCLOUD_INSTANCE_ID}
  version: "${KUBERNETES_VERSION}"
---
kind: IonosCloudMachineTemplate
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
metadata:
  name: "${CLUSTER_NAME}-control-plane"
spec:
  template:
    spec:
      datacenterID: ${IONOSCLOUD_DATACENTER_ID}
      numCores: ${IONOSCLOUD_MACHINE_NUM_CORES:-4}
      memoryMB: ${IONOSCLOUD_MACHINE_MEMORY_MB:-8192}
      type: ${IONOSCLOUD_MACHINE_TYPE:-VCPU}
      disk:
        image:
          id: ${IONOSCLOUD_MACHINE_IMAGE_ID}
      bootstrapVolume:
        image:
          id: ${IONOSCLOUD_BOOTSTRAP_VOLUME_IMAGE_ID}
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: "${CLUSTER_NAME}-workers"
  labels:
    cluster.x-k8s.io/cluster-name: "${CLUSTER_NAME}"
spec:
  clusterName: "${CLUSTER_NAME}"
  replicas: ${WORKER_MACHINE_COUNT}
  selector:
    matchLabels:
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: "${CLUSTER_NAME}"
        node-role.kubernetes.io/node: ""
    spec:
      clusterName: "${CLUSTER_NAME}"
      version: "${KUBERNETES_VERSION}"
      bootstrap:
        configRef:
          name: "${CLUSTER_NAME}-worker"
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: KubeadmConfigTemplate
      infrastructureRef:
        name: "${CLUSTER_NAME}-worker"
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: IonosCloudMachineTemplate
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: IonosCloudMachineTemplate
metadata:
  name: "${CLUSTER_NAME}-worker"
spec:
  template:
    spec:
      datacenterID: ${IONOSCLOUD_DATACENTER_ID}
      numCores: ${IONOSCLOUD_MACHINE_NUM_CORES:-2}
      memoryMB: ${IONOSCLOUD_MACHINE_MEMORY_MB:-4096}
      type: ${IONOSCLOUD_MACHINE_TYPE:-VCPU}
      disk:
        image:
          id: ${IONOSCLOUD_MACHINE_IMAGE_ID}
      bootstrapVolume:
        image:
          id: ${IONOSCLOUD_BOOTSTRAP_VOLUME_IMAGE_ID}
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: KubeadmConfigTemplate
metadata:
  name: "${CLUSTER_NAME}-worker"
spec:
  template:
    spec:
      format: ignition
      ignition:
        containerLinuxConfig:
          additionalConfig: |
            storage:
              files:
                - path: /opt/extensions/kubernetes/kubernetes-${KUBERNETES_VERSION}-x86-64.raw
                  mode: 0644
                  contents:
                    remote:
                      url: ${FLATCAR_SYSEXT_BASE_URL:-https://extensions.flatcar.org/extensions}/kubernetes-${KUBERNETES_VERSION}-x86-64.raw
                      verification:
                        hash:
                          function: sha512
                          sum: ${KUBERNETES_SYSEXT_SHA512}
              links:
                - path: /etc/extensions/kubernetes.raw
                  target: /opt/extensions/kubernetes/kubernetes-${KUBERNETES_VERSION}-x86-64.raw
                  hard: false
            systemd:
              units:
                - name: update-engine.service
                  mask: true
                - name: locksmithd.service
                  mask: true
                - name: systemd-sysupdate.timer
                  mask: true
                - name: systemd-sysupdate-reboot.timer
                  mask: true
                - name: kubeadm.service
                  dropins:
                    - name: 10-flatcar.conf
                      contents: |
                        [Unit]
                        Requires=containerd.service coreos-metadata.service
                        After=containerd.service coreos-metadata.service
                        [Service]
                        EnvironmentFile=/run/metadata/flatcar
      users:
        - name: core
          sshAuthorizedKeys: [${IONOSCLOUD_MACHINE_SSH_KEYS}]
      files:
        - path: /etc/ie-csi/cfg.json
          owner: root:root
          permissions: "0644"
          content: |
            {
              "datacenter-id": "${IONOSCLOUD_DATACENTER_ID}"
            }
      preKubeadmCommands:
        - >-
          (umask 0077; envsubst '$${COREOS_IONOSCLOUD_HOSTNAME} $${COREOS_IONOSCLOUD_INSTANCE_ID} $${COREOS_IONOSCLOUD_IPV4_DEFAULT}'
          < /etc/kubeadm.yml > /etc/kubeadm.yml.tmp)
        - mv /etc/kubeadm.yml.tmp /etc/kubeadm.yml
      joinConfiguration:
        nodeRegistration:
          name: $${COREOS_IONOSCLOUD_HOSTNAME}
          kubeletExtraArgs:
            node-ip: $${COREOS_IONOSCLOUD_IPV4_DEFAULT}
            provider-id: ionos://$${COREOS_IONOSCLOUD_INSTANCE_ID}
